# Collector of the second domain after section 29: the PPO configuration shipped with IsaacGymEnvs for
# AnymalTerrain (AnymalTerrainPPO.yaml: separate actor and critic MLPs 512-256-128, ELU, adaptive learning rate with
# KL target 0.008, 1,500 epochs), trained on the shipped rough-terrain task with its terrain curriculum and with the
# height scan (privileged input, 188 inputs). Its rollouts, without the reward and without the height scan, are the
# pretraining data of the second domain.
params:
  seed: 1
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
  config:
    name: d2_collector_terrain
    full_experiment_name: d2_collector_terrain
    env_name: ige_terrain_collector
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    clip_actions: False
    num_actors: 4096
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    e_clip: 0.2
    entropy_coef: 0.001
    learning_rate: 3.e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    truncate_grads: True
    grad_norm: 1.
    horizon_length: 24
    minibatch_size: 16384
    mini_epochs: 5
    critic_coef: 2
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.
    max_epochs: 1500
    save_best_after: 100
    score_to_win: 20000
    save_frequency: 50
    print_stats: True
    env_config:
      num_envs: 4096
      seed: 1
      headless: True
